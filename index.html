<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Sorter</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Tab Sorter</h1>
        <p>Put your tabs in order.</p>
      </header>
      <form id="sort-form">
        <label for="sort-mode">Sort by</label>
        <select id="sort-mode" name="sort-mode">
          <option value="title">Title · A–Z</option>
          <option value="hostname">Hostname · A–Z</option>
        </select>
        <div class="group-option">
          <label class="checkbox-label" for="group-hostname">
            <input id="group-hostname" type="checkbox" aria-describedby="group-hint" disabled />
            <span>Group by hostname</span>
          </label>
          <p id="group-hint">Choose hostname sorting to group tabs.</p>
        </div>
        <button id="sort-button" type="submit">Sort tabs</button>
        <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
      <footer>Current window only. Pinned tabs untouched.<br />Existing groups stay together.</footer>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
